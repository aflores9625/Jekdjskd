[package]
name = "vil-doctor"
version = "1.2.0"
edition = "2021"
description = "Read-only Windows health check that writes a detailed text report"

# Standalone crate: not part of the youtube-glass build.
[workspace]

[lib]
name = "vil_doctor"
path = "src/lib.rs"

[[bin]]
name = "vil-doctor"
path = "src/main.rs"

[[bin]]
name = "vil-doctor-cli"
path = "src/bin/vil-doctor-cli.rs"

[dependencies]
serde_json = "1"

[build-dependencies]
embed-resource = "3"

# Same WebView2 stack and versions as the main youtube-glass app.
[target.'cfg(windows)'.dependencies]
wry = "=0.45.0"
tao = "=0.30.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
